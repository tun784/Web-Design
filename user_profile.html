<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điện thoại Việt</title>
    <link href='./img/logo/Điện thoại Việt.png' rel='icon' type='image/x-icon' />
    <link rel="stylesheet" href="./css/user_profile.css">
    <link rel="stylesheet" href="./css/header_footer_new.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container light-style flex-grow-1 container-p-y">
        <h4 class="font-weight-bold py-3 mb-4">
            Cài đặt tài khoản
        </h4>
        <div class="card overflow-hidden">
             <div class="row no-gutters row-bordered row-border-light">
                <div class="col-md-3 pt-0" style="border-right: solid 1px black;">
                    <div class="list-group list-group-flush account-settings-links">
                        <a class="list-group-item list-group-item-action active" data-toggle="list"
                            href="#account-general">Thông tin chung</a>
                        <a class="list-group-item list-group-item-action" data-toggle="list"
                            href="#account-change-password">Thay đổi mật khẩu</a>
                        
                    </div>
                </div> 
                <div class="col-md-9">
                    <div class="tab-content">
                        <div class="tab-pane fade active show" id="account-general" style="background-color: #fff;">
                            <div class="card-body media align-items-center">
                                <img src="https://t3.ftcdn.net/jpg/05/53/79/60/360_F_553796090_XHrE6R9jwmBJUMo9HKl41hyHJ5gqt9oz.jpg" alt
                                    class="d-block ui-w-80">
                            </div>
                            <hr class="border-light m-0">
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label">Tên tài khoản</label>
                                    <input type="text" id ="username" class="form-control mb-1" value="">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="text" id ="phone"  class="form-control" value="">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">E-mail</label>
                                    <input type="text" id ="emal"  class="form-control mb-1" value="">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Địa chỉ</label>
                                    <input type="text" id ="address"  class="form-control" value="">
                                </div>
                            </div>  
                            <div class="text-right mt-3" style="padding-bottom: 20px;">
                                <button type="button" class="btn btn-primary" id ="saveINF">Lưu thay đổi</button>&nbsp;
                                <button type="button" class="btn btn-default" style="padding-right: 15px;">Huỷ</button>
                            </div>  
                        </div>
                        <div class="tab-pane fade" id="account-change-password"style="background-color: #fff;">
                            <div class="card-body pb-2">
                                <div class="form-group">
                                    <label class="form-label">Mật khẩu hiện tại</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Mật khẩu mới</label>
                                    <input type="password" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Xác nhận mật khẩu</label>
                                    <input type="password" class="form-control">
                                </div>
                            </div>
                            <div class="text-right mt-3" style="padding-bottom: 20px;">
                                <button type="button" class="btn btn-primary" >Lưu thay đổi</button>&nbsp;
                                <button type="button" class="btn btn-default" style="padding-right: 15px;">Huỷ</button>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
        <div class="text-right mt-3">
            <button type="button" class="btn back_home"><a href="./index.html">Quay về trang chủ</a></button>&nbsp;
        </div>
    </div>

    <div class="notifications"></div>


    
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
    <script src="https://code.jquery.com/jquery-1.10.2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function isValidJSON(str) {
                try {
                    JSON.parse(str);
                } catch (e) {
                    return false;
                }
                return true;
            }

            // Lấy dữ liệu từ localStorage
            const userJSON = localStorage.getItem('currentuser');

            // Kiểm tra nếu dữ liệu không tồn tại hoặc không hợp lệ
            if (!userJSON || !isValidJSON(userJSON)) {
                alert("Không tìm thấy hoặc dữ liệu không hợp lệ trong localStorage.");
                return;
            }

            let user = JSON.parse(userJSON);

            // Điền thông tin từ currentuser vào các trường input
            document.getElementById('username').value = user.fullname;
            document.getElementById('phone').value = user.phone;
            document.getElementById('email').value = user.email;
            document.getElementById('address').value = user.address;

            // Bắt sự kiện khi nhấn nút "Save changes"
            document.getElementById('saveINF').addEventListener('click', function() {
                // Lấy giá trị mới từ các trường input
                const newUsername = document.getElementById('username').value;
                const newPhone = document.getElementById('phone').value;
                const newEmail = document.getElementById('email').value;
                const newAddress = document.getElementById('address').value;

                // Cập nhật thông tin mới vào user object
                user.fullname = newUsername;
                user.phone = newPhone;
                user.email = newEmail;
                user.address = newAddress;

                // Lưu thông tin mới vào localStorage
                localStorage.setItem('currentuser', JSON.stringify(user));

                // Hiển thị thông báo hoặc thực hiện các hành động khác sau khi lưu thành công
                alert("Thông tin đã được cập nhật!");
            });
        });
    </script>
</body>

</html>
