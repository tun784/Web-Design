<!DOCTYPE html>
<html>

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Điện thoại Việt</title>
   <link href='./img/logo/Điện thoại Việt.png' rel='icon' type='image/x-icon' />
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
   <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css" rel="stylesheet" />
   <link href="./css/shopping cart.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href='./font/font-awesome-pro-v6-6.2.0/css/all.min.css'/> 
</head>

<body>

   <section>
       <div class="container">
           <h2 class="px-5 p-2">Giỏ hàng của tôi</h2>
           <div class="cart">
               <div class="col-md-12 col-lg-10 mx-auto" id="cart-items-container">
                   <h4><a href="./web.html">Về trang chủ</a></h4>
                   <!-- Các mục giỏ hàng sẽ được chèn vào đây -->
               </div>
               <div class="cart-item">
                   <div class="row g-2">
                       <div class="col-6">
                           <h5>Subtotal:</h5>
                           <h5>Tax:</h5>
                           <h5>Total:</h5>
                       </div>
                       <div class="col-6 status">
                           <h5><span id="sub-total">0</span></h5>
                           <h5><span id="tax-amount">0</span></h5>
                           <h5><span id="total-price">0</span></h5>
                       </div>
                   </div>
               </div>
               <div class="col-md-12 pt-4 pb-4">
                   <button type="button" class="btn btn-success check-out">Thanh toán</button>
               </div>
           </div>
       </div>
   </section>
   
   <script>
   document.addEventListener('DOMContentLoaded', function() {
   
       // Hàm cập nhật số lượng sản phẩm
       function updateCaseNumber(product, price, isIncreasing) {
           const caseInput = document.getElementById(product + '-number');
           let caseNumber = parseInt(caseInput.value);
           // Tăng hoặc giảm số lượng sản phẩm
           if (isIncreasing) {
               caseNumber++;
           } else if (caseNumber > 0) {
               caseNumber--;
           }
           caseInput.value = caseNumber;
   
           // Cập nhật tổng số tiền cho sản phẩm
           const caseTotal = document.getElementById(product + '-total');
           caseTotal.innerText = vnd(caseNumber * price);
           calculateTotal();
       }
   
       // Hàm lấy giá trị số lượng sản phẩm
       function getInputValue(product) {
           const productInput = document.getElementById(product + '-number');
           const productNumber = parseInt(productInput.value);
           return productNumber;
       }
   
       // Hàm tính toán tổng số tiền, thuế và tổng cộng
       // Hàm tính toán tổng số tiền, thuế và tổng cộng
function calculateTotal() {
   let subTotal = 0;
   const items = document.querySelectorAll('.cart-item');

   // Lấy dữ liệu từ localStorage
   const cartString = localStorage.getItem('currentuser');

   // Chuyển đổi dữ liệu từ chuỗi JSON sang đối tượng JavaScript
   const currentUser = JSON.parse(cartString);

   // Lấy mảng sản phẩm từ đối tượng currentUser
   const currentCart = currentUser.cart;
   currentCart.forEach(item => {
       const productPrice = item.gia;  // Lấy giá sản phẩm từ thuộc tính gia của đối tượng
       const productName = item.pname;  // Lấy tên sản phẩm từ thuộc tính pname của đối tượng
       const productNumber = parseInt(document.getElementById(`${productName}-number`).value);
       
       subTotal += productPrice * productNumber;  // Tính tổng subTotal
   });
   
   const tax = subTotal * 0.1;  // Tính thuế 10%
   const totalPrice = subTotal + tax;  // Tính tổng giá trị
   
   // Cập nhật trên HTML
   document.getElementById('sub-total').innerText = vnd(subTotal);
   document.getElementById('tax-amount').innerText = vnd(tax);
   document.getElementById('total-price').innerText = vnd(totalPrice);
}
   
       // Hàm định dạng giá trị thành tiền tệ VND
       function vnd(price) {
           return price.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
       }
   
       // Xử lý giỏ hàng từ localStorage khi trang được tải
       window.onload = function() {
           const currentUserString = localStorage.getItem('currentuser');
           if (currentUserString) {
               const currentUser = JSON.parse(currentUserString);
               if (currentUser && Array.isArray(currentUser.cart)) {
                   const cartItemsContainer = document.getElementById('cart-items-container');
                   let subtotal = 0;
   
                   currentUser.cart.forEach(item => {
                       // Tạo các phần tử HTML cho từng mục trong giỏ hàng
                       const cartItem = document.createElement('div');
                       cartItem.className = 'cart-item';
                       cartItem.innerHTML = `
                           <div class="row">
                               <div class="col-md-7 center-item">
                                   <img src="${item.image}" alt="">
                                   <h5>${item.pname} (<span>${vnd(item.gia)}</span>)</h5>
                               </div>
                               <div class="col-md-5 center-item">
                                   <div class="input-group number-spinner">
                                       <button id="${item.pname}-minus" class="btn btn-default"><i class="fas fa-minus"></i></button>
                                       <input id="${item.pname}-number" type="number" min="0" class="form-control text-center quantity-input" value="${item.soluong}">
                                       <button id="${item.pname}-plus" class="btn btn-default"><i class="fas fa-plus"></i></button>
                                   </div>
                                   <h5><span id="${item.pname}-total">${vnd(item.gia * item.soluong)}</span></h5>
                                   <i class="fa-sharp fa-regular fa-circle-xmark" id="remove-item"></i>
                               </div>
                           </div>
                       `;
   
                       cartItemsContainer.appendChild(cartItem);
   
                       // Thêm sự kiện cho nút tăng số lượng
                       document.getElementById(`${item.pname}-plus`).addEventListener('click', function() {
                           updateCaseNumber(item.pname, item.gia, true);
                       });
   
                       // Thêm sự kiện cho nút giảm số lượng
                       document.getElementById(`${item.pname}-minus`).addEventListener('click', function() {
                           updateCaseNumber(item.pname, item.gia, false);
                       });
   
                       // Tính toán tổng số phụ
                       subtotal += item.gia * item.soluong;
                   });
   
                   // Cập nhật tổng số phụ, thuế và tổng cộng
                   document.getElementById('sub-total').textContent = vnd(parseInt(subtotal));
                   const taxAmount = subtotal * 0.1; // Giả sử thuế là 10%
                   document.getElementById('tax-amount').textContent = vnd(parseInt(taxAmount));
                   document.getElementById('total-price').textContent = vnd(parseInt(subtotal) + parseInt(taxAmount));
               }
           }
       };
   });
   </script>
   
   </body>


</html>
